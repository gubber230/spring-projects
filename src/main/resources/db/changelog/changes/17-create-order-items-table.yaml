databaseChangeLog:
  - changeSet:
      id: 17-create-order-items-table
      author: Rostyslav
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: TINYINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseColumnNames: order_id
            baseTableName: order_items
            constraintName: FK_ORDER_ITEMS_ORDER
            referencedColumnNames: id
            referencedTableName: orders

        - addForeignKeyConstraint:
            baseColumnNames: book_id
            baseTableName: order_items
            constraintName: FK_ORDER_ITEMS_BOOK
            referencedColumnNames: id
            referencedTableName: books